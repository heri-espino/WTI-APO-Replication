[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wti-apo-replication"
version = "0.1.0.dev0"
description = "Bayesian volatility inference and Asian-option pricing methods with synthetic verification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Heriberto Espino-Montelongo" }]
keywords = ["Asian options", "Monte Carlo", "reproducibility", "WTI"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=2.0,<3.0", "scipy>=1.13,<2.0", "pandas>=2.2,<3.0"]

[project.optional-dependencies]
market = ["yfinance>=0.2.0"]
dev = [
  "pytest>=8.0,<10.0",
  "PyYAML>=6.0,<7.0",
  "build>=1.2,<2.0",
]

[project.scripts]
wti-apo-synthetic = "wti_apo_replication.synthetic:main"

[project.urls]
Repository = "https://github.com/heri-espino/WTI-APO-Replication"
Documentation = "https://github.com/heri-espino/WTI-APO-Replication/blob/main/docs/reproducibility.md"
Issues = "https://github.com/heri-espino/WTI-APO-Replication/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["wti_apo_replication*", "bayesian_asian_options*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
