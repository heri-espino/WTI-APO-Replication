name: public-scaffold-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  safe-public-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run lightweight repository safety tests
        run: python -m unittest discover -s tests -v
