name: public-replication-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and lightweight test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check public file safety
        run: python scripts/verify_public_scaffold.py
      - name: Validate citation, environment and build metadata
        run: python scripts/validate_release_metadata.py
      - name: Validate CITATION.cff with the official CFF schema
        run: |
          python -m pip install cffconvert==2.0.0
          cffconvert --validate
      - name: Run unit tests
        run: python -m pytest -q
      - name: Generate data-free experiment001 reference summary
        run: python -m experiments.experiment001.run --seed 2026 --grid-points 301
