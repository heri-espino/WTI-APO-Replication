name: publish-verified-release

# Manual-only; no release is published by push/PR.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Approved stable version, e.g. 0.1.0 (without v)"
        required: true
        type: string
      confirm_scientific_review:
        description: "I reviewed the scientific scope, licensing and review anonymity"
        required: true
        type: boolean
        default: false
      confirm_zenodo_enabled:
        description: "I enabled this repository in Zenodo before the release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-verified-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
         inputs.confirm_scientific_review &&
         inputs.confirm_zenodo_enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation and packaging utilities
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "cffconvert==2.0.0" "twine>=6,<7"
      - name: Check stable version, approval, and citation metadata
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = os.environ["RELEASE_VERSION"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), "Use stable X.Y.Z"
          with open("pyproject.toml", "rb") as f:
              project_version = tomllib.load(f)["project"]["version"]
          assert project_version == version, "Version differs from pyproject.toml"
          PY
          python scripts/verify_public_scaffold.py
          python scripts/validate_release_metadata.py --release
          cffconvert --validate
      - name: Test publication subset
        run: python -m pytest -q
      - name: Build and verify wheels and source distribution
        run: |
          python -m build
          python -m twine check dist/*
          for f in dist/*.whl dist/*.tar.gz; do sha256sum "$f"; done > dist/SHA256SUMS.txt
      - name: Publish approved GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "WTI APO Replication $TAG" \
            --notes-file docs/release_notes.md
